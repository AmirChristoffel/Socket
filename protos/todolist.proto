// Sintaxe do Protocol Buffers 3
syntax = "proto3";

// Enum para os diferentes tipos de dispositivos
enum DeviceType {
  UNKNOWN = 0;
  CAMERA = 1;
  LAMP_POST = 2;   // Poste
  TRAFFIC_LIGHT = 3; // Semáforo
  AIR_QUALITY_SENSOR = 4;
  TEMPERATURE_SENSOR = 5;
}

// 1. Mensagem oficial de Descoberta
message GatewayDiscovery {
  int32 data_port = 1;
}

// 2. Anúncio do Dispositivo
message DeviceAnnouncement {
  string device_id = 1;
  DeviceType type = 2;
  string ip_address = 3;
  int32 port = 4;
  bool is_actuator = 5;
}

// 3. Dados do Sensor
message SensorData {
  string device_id = 1;
  float value = 2;
  string unit = 3;
  int64 timestamp = 4; // Nosso timestamp!
}

// 4. Comando para Atuador expandido
message ActuatorCommand {
  string device_id = 1;
  bool state = 2;
  int32 frequency_seconds = 3; 
  float threshold = 4;         
  bool enabled = 5;            
}

// 5. Novas mensagens do Cliente Analítico
message ClientRequest {
  string command = 1;
  string target_device_id = 2;
  bool new_state = 3;
}

message GatewayResponse {
  string status = 1;
  string message = 2;
}

// 6. O Envelope Universal (Atualizado com todos os payloads)
message SmartCityMessage {
  oneof payload {
    GatewayDiscovery discovery = 1;
    DeviceAnnouncement announcement = 2;
    SensorData sensor_data = 3;
    ActuatorCommand command = 4;
    ClientRequest client_request = 5;
    GatewayResponse gateway_response = 6;
  }
}